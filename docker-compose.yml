services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-event_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-event_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-event_user} -d ${POSTGRES_DB:-event_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no port published — only the backend talks to it
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-event_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-event_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-event_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      NUM_PROXIES: ${NUM_PROXIES:-1}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-16384}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
